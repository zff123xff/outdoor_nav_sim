/**:
  ros__parameters:
    input_topic: "/waypoint_goals"
    output_topic: "/gp_goal"
    frame_id: "gps"
    navsat_status: 1       # NavSatStatus.STATUS_FIX
    navsat_service: 1      # NavSatStatus.SERVICE_GPS

    # ENU origin for arrival detection (must match nav2_input_bridge's reference_*)
    reference_latitude: 0.0
    reference_longitude: 0.0
    reference_altitude: 0.0

    # Arrival detection
    reach_threshold_m: 0.5
    consecutive_required: 5
    check_period_s: 0.1