    weather_state: task_manage/weather_state # 变量类型 int32_t 0:白天 1：夜间

#陈博文
  task_takeoffgather:
    take_one_sub_topic: /swarm_brige/group/take_one
    take_one_pub_topic: /swarm_brige/take_one
#汪桉旭
  task_search:
#吴天皓
  task_attack:
     target_info_topic: task_attack/targets_pose  # 目标信息 [msg_set_msgs::msg::TargetInfo]
