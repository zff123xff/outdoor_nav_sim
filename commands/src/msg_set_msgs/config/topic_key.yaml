    takeoffgather_topic: task_manage/takeoff_gathering
    exploration_topic: task_manage/exploration
    search_topic: task_manage/search_attack
    attack_topic: task_manage/search_attack
    fixedpoint_topic: task_manage/fixed_point
    antijam_topic: task_manage/anti_jam
    dropreturn_topic: task_manage/drop_return
    shield_topic: task_manage/cover_task
    shield_path_topic: task_manage/cover_path
    shield_param_topic : task_manage/cover_param
    shield_jump_topic: task_manage/jump_index
    avoid_list_topic: algo_avoid/input
    cover_reach_index: task_shield/past_index
    confirm_info: task_manage/confirm_info # cover_task 确认信息
    cover_confirm: task_manage/cover_confirm # cover_task 确认信息
    coverParam_confirm: task_manage/coverParam_con # cover_param 确认信息
    cover_jump_point: task_manage/jump_point  #jump 跳转某一个点
    drones_id_adjust: task_manage/drones_id 
